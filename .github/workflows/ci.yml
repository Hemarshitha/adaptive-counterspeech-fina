name: research-system
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: research
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: research_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U research -d research_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://research:ci-only@127.0.0.1:5432/research_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.lock
      - run: python -m pip install -r backend/requirements-dev.lock
      - run: python -m pip install --no-deps -e ./backend
      - run: ruff check backend
      - run: ruff format --check backend
      - run: pytest backend/tests -q
  dashboard:
    runs-on: ubuntu-latest
    env:
      PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: python -m pip install -r backend/requirements-dev.lock
      - run: python -m pip install --no-deps -e ./backend
      - run: ruff check dashboard/tests
      - run: ruff format --check dashboard/tests
      - run: npm ci
        working-directory: dashboard
      - run: npm run format:check
        working-directory: dashboard
      - run: npm run build
        working-directory: dashboard
      - run: npm test
        working-directory: dashboard
      - run: npx playwright install --with-deps chromium
        working-directory: dashboard
      - run: npm run test:e2e
        working-directory: dashboard
